name: SentinelX CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality-and-test:
    name: Code Quality & Automated Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Test Fixtures
        run: python tests/fixtures/generate_fixtures.py

      - name: Ruff Code Linter
        run: ruff check .

      - name: Bandit Security Scanner
        run: bandit -r app

      - name: Run Test Suite (Unit, Integration, E2E)
        run: pytest -v --cov=app --cov-report=term-missing

      - name: Build Standalone Executable with PyInstaller
        run: python scripts/build.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelX-Windows-x64
          path: dist/SentinelX/
